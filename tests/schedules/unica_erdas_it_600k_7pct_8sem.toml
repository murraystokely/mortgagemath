notes = """Ammortamento italiano (quota capitale costante). Slide 5 prints the \
complete 8-row table with columns t / Ch / Ih / Rh / Dh; slide 4 shows the \
derivation of the semi-annual rate as the *equivalent* rate \
i_(1/2) = (1 + 0.07)^(1/2) - 1 = 0.034408, which is why compounding = "annual" \
(effective annual) and not the nominal annual/2 convention. The exercise works \
in whole euros throughout — every printed figure is an integer — so \
currency_unit = "1" reproduces the published display precision. All 32 printed \
cells (8 rows x 4 columns) match. The header row also prints Dh = 600.000,00, \
iANNUALE = 7,00% and 'Durata in semestri 8'."""
